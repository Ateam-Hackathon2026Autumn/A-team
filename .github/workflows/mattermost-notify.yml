name: Mattermost Notification

on:
  push:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
      EVENT_NAME: ${{ github.event_name }}
      REPOSITORY: ${{ github.repository }}
      ACTOR: ${{ github.actor }}
      SERVER_URL: ${{ github.server_url }}
      REF_NAME: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      PR_ACTION: ${{ github.event.action }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
    steps:
      - name: Send notification
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${MATTERMOST_WEBHOOK_URL:-}" ]]; then
            echo "MATTERMOST_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          repository_url="${SERVER_URL}/${REPOSITORY}"
          actor_url="${SERVER_URL}/${ACTOR}"

          if [[ "${EVENT_NAME}" == "push" ]]; then
            short_sha="${SHA:0:7}"
            message="${COMMIT_MESSAGE:-No commit message}"
            commit_url="${repository_url}/commit/${SHA}"
            text=$(printf '### 🚀 [%s](%s) がpushしました\n- Branch: `%s`\n- Commit: `%s`\n- URL: %s\n- Message: %s' \
              "${ACTOR}" "${actor_url}" "${REF_NAME}" "${short_sha}" \
              "${commit_url}" "${message}")
          else
            case "${PR_ACTION}" in
              opened) status="作成" ;;
              reopened) status="再オープン" ;;
              synchronize) status="更新" ;;
              ready_for_review) status="レビュー可能に変更" ;;
              closed)
                if [[ "${PR_MERGED}" == "true" ]]; then
                  status="マージ"
                else
                  status="クローズ"
                fi
                ;;
              *) status="${PR_ACTION}" ;;
            esac

            text=$(printf '### 🔀 [%s](%s) がPull Requestを%sしました\n- Branch: `%s` → `%s`\n- PR: `#%s` %s\n- URL: %s' \
              "${ACTOR}" "${actor_url}" "${status}" "${PR_HEAD_REF}" \
              "${PR_BASE_REF}" "${PR_NUMBER}" "${PR_TITLE}" "${PR_URL}")
          fi

          payload=$(jq -n --arg text "${text}" '{text: $text}')

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "${payload}" \
            "${MATTERMOST_WEBHOOK_URL}"
