name: marche
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # 既定はモックを使わず、Vite の proxy（/api -> backend:8000）経由で実バックエンドに接続する（VITE_USE_MOCK で上書き可）
      VITE_USE_MOCK: "${VITE_USE_MOCK:-false}"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py seed_dev --masters-only &&
        python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-hackathon}
      DB_USER: ${MYSQL_USER:-hackathon}
      DB_PASSWORD: ${MYSQL_PASSWORD:-hackathon_password}
      # 以下は .env に書けば backend に渡る。空なら config/settings.py の既定値（ローカル用）になる
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_COOKIE_SECURE: ${DJANGO_COOKIE_SECURE:-}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-}
      DJANGO_ADMIN_ENABLED: ${DJANGO_ADMIN_ENABLED:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-}
      DJANGO_MEDIA_URL: ${DJANGO_MEDIA_URL:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-${AWS_TEST_UPLOADS_BUCKET_NAME:-}}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
      DJANGO_PUBLIC_IMAGE_BASE_URL: ${DJANGO_PUBLIC_IMAGE_BASE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      TERMS_VERSION: ${TERMS_VERSION:-}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hackathon}
      MYSQL_USER: ${MYSQL_USER:-hackathon}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hackathon_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  frontend_node_modules:
  mysql_data:
