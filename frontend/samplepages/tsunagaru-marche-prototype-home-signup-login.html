<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>つながるマルシェ｜つくる人と、つながる暮らし。</title>
    <meta name="description" content="買う・体験する・働く・学ぶ。生産者と直接つながるマルシェの画面サンプル。" />
    <style>

        --green: #2f6b4f;

        --ink: #26332b;

      * {

        color: var(--ink);
        font:

      a {

      }
      button,
      input,
      select {

      }
      button,
      a,
      input,
      select {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        background: #e4e7de !important;
        color: #697369 !important;
        border-color: #e4e7de !important;
      }
      a:hover {
        text-decoration: underline;

      button:hover:not(:disabled) {

      h3,
      p {

      h3 {

        text-align: center;

        padding: 5px 16px;
        letter-spacing: 0.06em;
      }
      .header {

      .actions {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .btn {
        border: 1px solid var(--green);
        background: var(--green);
        color: white;
        border-radius: 999px;
        padding: 11px 24px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 14px;

      .btn.outline {

      .btn.orange {

        color: var(--ink);

      .btn.light {

      .summary {

      .center {
        text-align: center;
      }
      .right {
        text-align: right;
      }
      .auth-note {

        text-align: center;

      .choice {

      .choice small {

      .choice-icon {

      .interests {

      .chip {

  <body>
    <a class="skip" href="#main">本文へ</a><noscript>このサンプルの動作にはJavaScriptを有効にしてください。</noscript>
    
    <div id="app"></div>
    <dialog id="dialog">
      <button class="close" aria-label="閉じる">×</button>
      <div id="dialog-body"></div>
    </dialog>
    <script>
      const DEMO_BASE = "https://marche-demo.invalid";
      function routeURL() {
        const route = location.hash.startsWith("#/") ? location.hash.slice(1) : "/";
        return new URL(route, DEMO_BASE);
      }
      window.addEventListener("hashchange", () => {
        state.busy = false;
        state.draft = {};
        render();
        const id = routeURL().hash.slice(1);
        if (id) document.getElementById(id)?.scrollIntoView();
        else window.scrollTo(0, 0);
      });
      /* Browser-only prototype: no network requests, no persistence of personal data. */
      const app = document.querySelector("#app");
      const state = { step: 1, purpose: "", draft: {}, interests: [], user: null, tab: "featured", busy: false, scenario: "success", favorites: new Set() };
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

      function capture(form) {
        const fd = new FormData(form);
        for (const [k, v] of fd) if (k !== "interests") state.draft[k] = v;
        if (form.id === "signup-form") {
          state.draft.agreedToTerms = fd.has("agreedToTerms");
          state.draft.agreedToPrivacyPolicy = fd.has("agreedToPrivacyPolicy");
          state.interests = fd.getAll("interests");
        }
      }
      function validate(d, signup = true) {
        const errors = {};
        if (signup) {
          for (const n of ["lastName", "firstName"]) if (!String(d[n] || "").trim() || [...d[n].trim()].length > 10) errors[n] = "1〜10文字で入力してください。";
          if (!d.phone?.trim() || !/^\+?[0-9() -]{7,50}$/.test(d.phone) || d.phone.replace(/\D/g, "").length < 7) errors.phone = "電話番号を正しく入力してください。";
          if (!d.birthDate || !/^\d{4}-\d{2}-\d{2}$/.test(d.birthDate) || Number.isNaN(Date.parse(d.birthDate)) || new Date(d.birthDate).toISOString().slice(0, 10) !== d.birthDate || d.birthDate > today()) errors.birthDate = "過去または今日の、実在する日付を入力してください。";
          if (!d.agreedToTerms) errors.agreedToTerms = "利用規約への同意が必要です。";
          if (!d.agreedToPrivacyPolicy) errors.agreedToPrivacyPolicy = "プライバシーポリシーへの同意が必要です。";
          if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!-/:-@\[-`{-~])[\x21-\x7E]{8,30}$/.test(d.password || "")) errors.password = "8〜30文字で、英大文字・英小文字・数字・記号を各1文字以上含めてください。";
        } else if (!d.password) errors.password = "パスワードを入力してください。";
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(d.email || "").trim()) || String(d.email).trim().length > 255) errors.email = "メールアドレスを正しく入力してください。";
        return errors;
      }
      function showErrors(errors) {
        document.querySelectorAll(".error").forEach((x) => (x.textContent = ""));
        document.querySelectorAll("[aria-invalid]").forEach((x) => x.removeAttribute("aria-invalid"));
        for (const [k, v] of Object.entries(errors)) {
          const error = document.getElementById(k + "-error");
          if (error) error.textContent = v;
          const input = document.querySelector(`[name="${k}"]`);
          if (input) input.setAttribute("aria-invalid", "true");
        }
        if (Object.keys(errors).length) {
          document.querySelector("#form-error").textContent = "入力内容をご確認ください。";
          document.querySelector(`[name="${Object.keys(errors)[0]}"]`)?.focus();
          return true;
        }
        document.querySelector("#form-error").textContent = "";
        return false;
      }
      // Adapter contract for implementation: POST /api/v1/users with credentials: include,
      // X-CSRFToken from GET /api/v1/auth/csrf. This prototype intentionally sends nothing.
      function registrationPayload() {
        const d = state.draft;
        return {
          lastName: d.lastName.trim(),
          firstName: d.firstName.trim(),
          email: d.email.trim().toLowerCase(),
          password: d.password,
          phone: d.phone.trim(),
          birthDate: d.birthDate,
          prefectureId: d.prefectureId ? Number(d.prefectureId) : null,
          interests: state.interests,
          agreedToTerms: !!d.agreedToTerms,
          agreedToPrivacyPolicy: !!d.agreedToPrivacyPolicy,
          termsVersion: "demo-2026-10-24",
          privacyPolicyVersion: "demo-2026-10-24",
        };
      }
      async function submit(form, signup) {
        if (state.busy) return;
        capture(form);
        if (showErrors(validate(state.draft, signup))) return;
        state.busy = true;
        const button = document.querySelector("#submit");
        button.disabled = true;
        button.textContent = signup ? "登録しています…" : "ログインしています…";
        form.setAttribute("aria-busy", "true");
        const payload = signup ? registrationPayload() : null;
        await new Promise((r) => setTimeout(r, 650));
        if (!document.contains(form)) return;
        state.busy = false;
        button.disabled = false;
        button.textContent = signup ? "登録する →" : "ログイン →";
        form.removeAttribute("aria-busy");
        const sc = state.scenario;
        if (sc === "400") {
          showErrors({ phone: "電話番号の形式を確認してください。" });
          return;
        }
        if (sc !== "success") {
          const messages = {
            409: "このメールアドレスは登録済みです。ログイン画面からお進みください。",
            401: "メールアドレスまたはパスワードを確認してください。",
            403: "リクエストを確認できませんでした。もう一度登録ボタンを押してください。",
            policy: "規約が更新されました。内容を確認して、再度同意してください。",
            429: "操作が多すぎます。時間をおいて再度お試しください。",
            500: "サーバーで問題が発生しました。時間をおいて再度お試しください。",
            network: "通信できませんでした。接続を確認して再度お試しください。",
          };
          document.querySelector("#form-error").innerHTML = esc(messages[sc]) + (sc === "409" ? ' <a href="/signin" data-route>ログインへ</a>' : "");
          if (sc === "policy") {
            for (const n of ["agreedToTerms", "agreedToPrivacyPolicy"]) {
              state.draft[n] = false;
              form.elements[n].checked = false;
            }
          }
          return;
        }
        if (!signup && (state.draft.email.trim().toLowerCase() !== "demo@example.com" || state.draft.password !== "DemoPass123!")) {
          document.querySelector("#form-error").textContent = "メールアドレスまたはパスワードを確認してください。デモ用の情報は「デモの動作を切り替える」に記載しています。";
          return;
        }
        state.user = { lastName: signup ? payload.lastName : "山田", email: signup ? payload.email : "demo@example.com", isProducer: false, producerApplicationStatus: "not_applied", producerAccountStatus: null, emailVerified: false };
        state.draft = {};
        state.interests = [];
        if (signup) {
          state.step = 3;
          render();
          window.scrollTo(0, 0);
        } else {
          const dest = new URLSearchParams(routeURL().search).get("returnTo");
          const safe = dest && /^\/(?!\/)/.test(dest) && !dest.includes("\\");
          if (safe && ["/", "/signup"].includes(new URL(dest, DEMO_BASE).pathname)) navigate(dest);
          else {
            navigate("/");
            if (dest) modal("ログインしました", "<p>元のページへ戻る動作を再現しました。商品詳細・応募・生産者申請などの画面は、この3画面サンプルの対象外です。</p>");
          }
        }
      }
      document.addEventListener("submit", (e) => {
        if (e.target.id === "purpose-form") {
          e.preventDefault();
          if (state.purpose) {
            state.step = 2;
            render();
            window.scrollTo(0, 0);
          }
        }
        if (["signup-form", "signin-form"].includes(e.target.id)) {
          e.preventDefault();
          submit(e.target, e.target.id === "signup-form");
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.name === "purpose") {
          state.purpose = e.target.value;
          document.querySelector("#next").disabled = false;
        }
        if (e.target.id === "scenario") state.scenario = e.target.value;
      });
      document.addEventListener("click", (e) => {
        const t = e.target.closest("a,button");
        if (!t) return;
        if (t.hasAttribute("data-route")) {
          e.preventDefault();
          if (state.busy) return;
          state.draft = {};
          state.interests = [];
          state.scenario = "success";
          navigate(t.getAttribute("href"));
          return;
        }
        if (t.dataset.scroll) {
          e.preventDefault();
          if (routeURL().pathname !== "/") navigate("/#" + t.dataset.scroll);
          else document.getElementById(t.dataset.scroll)?.scrollIntoView();
          return;
        }
        if (t.dataset.tab) {
          state.tab = t.dataset.tab;
          document.querySelectorAll("[data-tab]").forEach((x) => x.setAttribute("aria-selected", String(x.dataset.tab === state.tab)));
          document.querySelector("#producer-grid").innerHTML = producerCards();
          document.querySelector("#producer-grid").setAttribute("aria-labelledby", state.tab + "-tab");
          return;
        }
        if (t.hasAttribute("data-fav")) {
          const id = +t.dataset.fav;
          state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id);
          t.textContent = state.favorites.has(id) ? "♥" : "♡";
          t.setAttribute("aria-pressed", String(state.favorites.has(id)));
          t.setAttribute("aria-label", products[id][1] + (state.favorites.has(id) ? "をお気に入りから削除" : "をお気に入りに追加"));
          return;
        }
        if (t.dataset.detail) {
          const p = products[+t.dataset.detail];
          modal(p[1], `<p>${p[2]} · ${p[3]}<br>¥${p[4]}（税込）</p><p>商品詳細・購入はサンプルの対象外です。画面遷移の入口として表示しています。</p>`);
          return;
        }
        if (t.hasAttribute("data-detail")) {
          const p = products[0];
          modal(p[1], `<p>${p[2]} · ${p[3]}<br>¥${p[4]}（税込）</p><p>商品詳細・購入はサンプルの対象外です。</p>`);
          return;
        }
        if (t.dataset.producer) {
          modal(t.dataset.producer, "<p>これは架空の生産者プロフィールです。生産者の想いや、商品・体験・求人へつながる入口を想定しています。</p>");
          return;
        }
        if (t.dataset.opportunity) {
          modal(t.dataset.opportunity, `<p>掲載情報は架空です。実際の応募・体験申込は行われません。</p><button class="btn" id="continue-signin">${state.user ? "アカウントを確認する" : "ログインして手続きを続ける"}</button>`);
          document.querySelector("#continue-signin").onclick = () => {
            document.querySelector("#dialog").close();
            if (state.user) actions.mypage();
            else navigate("/signin?returnTo=" + encodeURIComponent("/#jobs"));
          };
          return;
        }
        const action = t.dataset.action;
        if (action) {
          e.preventDefault();
          actions[action]?.();
        }
      });
      const actions = {
        reveal() {
          const input = document.querySelector("#password");
          input.type = input.type === "password" ? "text" : "password";
          const b = document.querySelector(".reveal");
          b.textContent = input.type === "password" ? "表示" : "隠す";
          b.setAttribute("aria-pressed", String(input.type === "text"));
        },
        back() {
          capture(document.querySelector("#signup-form"));
          state.step = 1;
          render();
          window.scrollTo(0, 0);
        },
        logout() {
          state.user = null;
          state.step = 1;
          state.purpose = "";
          state.draft = {};
          state.scenario = "success";
          navigate("/");
        },
        application() {
          modal("生産者登録申請へ", `<p>遷移先：<code>/producer-application/new</code></p><p>共通アカウントは作成済みです。申請後は管理者の承認待ちとなります。生産者権限は、承認まで付与されません。</p><p>生産者申請画面は今回の3画面サンプルの対象外です。</p>`);
        },
        mypage() {
          if (!state.user) {
            navigate("/signin?returnTo=/mypage");
            return;
          }
          modal("マイページへの入口", `<p>${esc(state.user.lastName)}さん · ${esc(state.user.email)}</p><p>デモログイン中／生産者申請：未申請<br>遷移先：<code>/mypage</code></p><button class="btn" id="apply-producer">生産者登録を申請する</button>`);
          document.querySelector("#apply-producer").onclick = () => actions.application();
        },
        terms() {
          modal("利用規約（サンプル）", "<p>デモ版：demo-2026-10-24</p><p>これは画面確認用の仮の規約です。実サービスの利用規約ではありません。本番では正式な本文と版をAPIの現行版に合わせて表示します。</p>");
        },
        privacy() {
          modal("プライバシーポリシー（サンプル）", "<p>デモ版：demo-2026-10-24</p><p>入力情報はこのページを開いている間のメモリだけで扱い、サーバーへ送信しません。ページの再読み込みで消えます。実サービスでは正式なポリシーを表示します。</p>");
        },
        contact() {
          modal("お問い合わせ", "<p>お問い合わせはアカウント作成不要の導線とします。</p><p>問い合わせフォームの送信機能は、このサンプルには含まれていません。</p>");
        },
        faq() {
          modal("よくある質問", "<p><b>生産者として利用するには？</b><br>共通アカウントを作成し、生産者登録申請を行います。管理者の承認後に利用できます。</p><p><b>このサンプルで購入できますか？</b><br>画面と登録フローの確認用のため、購入はできません。</p>");
        },
        reset() {
          modal("パスワードの再設定", "<p>再設定メールの送信は、このサンプルでは行いません。本番ではパスワード再設定の手続きへ進みます。</p>");
        },
        favorites() {
          const ps = [...state.favorites].map((i) => products[i][1]);
          modal("お気に入り", ps.length ? "<p>" + ps.map(esc).join("<br>") + "</p>" : "<p>まだ登録されていません。商品カードの♡を押すと追加できます。</p>");
        },
        cart() {
          modal("カート", "<p>カートは空です。購入機能は、この3画面サンプルの対象外です。</p>");
        },
        search() {
          modal("商品を検索", '<form id="search-form"><label class="field">商品名・生産者・産地<input name="q" type="search" placeholder="野菜、長野、そらいろ…"></label><button class="btn block">検索する</button><p class="hint">ホームに掲載した4商品の中から検索します。</p></form>');
          document.querySelector("#search-form").onsubmit = (e) => {
            e.preventDefault();
            const q = new FormData(e.target).get("q").trim();
            document.querySelector("#dialog").close();
            navigate("/#products");
            let n = 0;
            document.querySelectorAll("[data-product]").forEach((c) => {
              const hit = products[+c.dataset.product].join(" ").includes(q);
              c.hidden = !hit;
              if (hit) n++;
            });
            modal("検索結果", `<p>「${esc(q)}」：${n}件。商品欄に結果を表示しました。</p>`);
          };
        },
        "all-products"() {
          document.querySelectorAll("[data-product]").forEach((c) => (c.hidden = false));
          document.querySelector("#products").scrollIntoView();
        },
        story() {
          modal("土を育て、季節に寄り添う", "<p>そらいろ農園のストーリー（架空のサンプル）</p><p>朝の畑で土に触れ、野菜の様子を見る。一つひとつの変化を大切にしながら、旬のおいしさを届けています。</p><p>生産者プロフィールから商品や体験へつながる構成を想定しています。</p>");
        },
      };
      window.addEventListener("popstate", () => {
        state.busy = false;
        state.draft = {};
        render();
      });
      if (new URLSearchParams(routeURL().search).get("purpose") === "producer") state.purpose = "producer";
      render();
      if (routeURL().hash) setTimeout(() => document.getElementById(routeURL().hash.slice(1))?.scrollIntoView(), 0);
    </script>
  </body>
</html>
